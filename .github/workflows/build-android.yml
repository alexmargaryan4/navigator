name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: navigation_app

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=MAP_API_KEY=${{ secrets.MAP_API_KEY }} \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/navigation-android-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigation-android-release
          path: navigation_app/build/app/outputs/flutter-apk/navigation-android-release.apk
          if-no-files-found: error
