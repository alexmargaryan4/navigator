name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: navigation_app

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test

      - name: Check secrets are present (lengths only, no leaked values)
        run: |
          echo "MAP_API_KEY length: ${#MAP_API_KEY}"
          echo "GEOAPIFY_API_KEY length: ${#GEOAPIFY_API_KEY}"
          echo "GROQ_API_KEY length: ${#GROQ_API_KEY}"
          if [ -z "$MAP_API_KEY" ]; then
            echo "::error::MAP_API_KEY secret is empty or not set on this repo/branch."
          fi
          if [ -z "$GEOAPIFY_API_KEY" ]; then
            echo "::warning::GEOAPIFY_API_KEY secret is empty or not set on this repo/branch. Hybrid search will fall back to Mapbox-only."
          fi
        env:
          MAP_API_KEY: ${{ secrets.MAP_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=MAP_API_KEY=${{ secrets.MAP_API_KEY }} \
            --dart-define=GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }} \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/navigation-android-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigation-android-release
          path: navigation_app/build/app/outputs/flutter-apk/navigation-android-release.apk
          if-no-files-found: error
