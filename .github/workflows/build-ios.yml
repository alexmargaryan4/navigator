name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: navigation_app

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test

      - name: Check secrets are present (lengths only, no leaked values)
        run: |
          echo "MAP_API_KEY length: ${#MAP_API_KEY}"
          echo "GEOAPIFY_API_KEY length: ${#GEOAPIFY_API_KEY}"
          echo "GROQ_API_KEY length: ${#GROQ_API_KEY}"
          if [ -z "$MAP_API_KEY" ]; then
            echo "::error::MAP_API_KEY secret is empty or not set on this repo/branch."
          fi
          if [ -z "$GEOAPIFY_API_KEY" ]; then
            echo "::warning::GEOAPIFY_API_KEY secret is empty or not set on this repo/branch. Hybrid search will fall back to Mapbox-only."
          fi
        env:
          MAP_API_KEY: ${{ secrets.MAP_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Build unsigned iOS release
        run: |
          set -e
          # `flutter build ios --release --no-codesign` still runs flutter_tools'
          # own Development-Team check for release/device builds, which fails
          # even with signing disabled in Xcode (a long-standing Flutter
          # limitation — see flutter/flutter#113203, #148370). Building the
          # Flutter assets first and then invoking xcodebuild directly avoids
          # that check entirely while still producing a real, unsigned Runner.app.
          flutter build ios --release --no-codesign --config-only \
            --dart-define=MAP_API_KEY=${{ secrets.MAP_API_KEY }} \
            --dart-define=GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }} \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          mkdir -p ../build/ios/iphoneos
          rm -rf ../build/ios/iphoneos/Runner.app
          cp -r ../build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app \
            ../build/ios/iphoneos/Runner.app

      - name: Package unsigned IPA
        run: |
          set -e
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/Runner.app
          zip -r navigation-ios-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigation-ios-unsigned
          path: navigation_app/build/ios/iphoneos/navigation-ios-unsigned.ipa
          if-no-files-found: error
